<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1512" />
    <title>Controle</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none }
      html, body { margin: 0; height: 100%; background: #1b1512; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none }
      #join { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; padding: 20px }
      #join h1 { margin: 0 0 6px; font-size: 26px }
      #join input { font-size: 22px; padding: 12px; width: 240px; text-align: center; border-radius: 10px; border: 0; text-transform: uppercase }
      #join button { font-size: 20px; font-weight: 700; padding: 12px 28px; border: 0; border-radius: 10px; background: #c85b72; color: #fff }
      #err { color: #ff8a8a; min-height: 20px }
      #pad { position: fixed; inset: 0; display: none }
      .zone { position: absolute; top: 0; bottom: 0; width: 50% }
      #zl { left: 0 } #zr { right: 0 }
      .hint { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; opacity: .35; font-size: 13px }
      .base { position: fixed; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; border: 3px solid #fff5; background: #fff1; display: none; pointer-events: none }
      .knob { position: absolute; left: 37px; top: 37px; width: 56px; height: 56px; border-radius: 50%; background: #fffb }
      #zr .base { border-color: #ff8a1f88; background: #ff8a1f18 } #zr .knob { background: #ff9d3fdd }
      #top { position: absolute; left: 0; right: 0; top: 0; padding: 10px 14px; display: flex; gap: 12px; align-items: center; pointer-events: none; font-size: 14px }
      #hp { width: 140px; height: 10px; background: #444; border-radius: 5px; overflow: hidden } #hp i { display: block; height: 100%; width: 100%; background: #6fd36f }
      #btns { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; display: flex; gap: 14px }
      #btns button { position: relative; overflow: hidden; font-size: 15px; font-weight: 700; padding: 12px 16px; border: 0; border-radius: 12px; background: #fff2; color: #fff; touch-action: manipulation }
      #btns button:active { background: #fff5 }
      #btns button::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--cd, 0) * 100%); background: #000a; pointer-events: none }
      #btns button.hide { display: none }
      #use { position: absolute; right: 22px; bottom: 124px; width: 84px; height: 84px; border-radius: 50%; border: 3px solid #7fd0ff; background: #2a6a9a99; color: #fff; font-size: 14px; font-weight: 800; display: none; touch-action: manipulation }
      #use.near { display: block; animation: pulse 1s infinite alternate } #use.in { display: block; border-color: #ffcf9a; background: #9a5a2a99 }
      @keyframes pulse { to { transform: scale(1.08); background: #3a8ac8cc } }
      #cls { font-weight: 800 }
      .side { position: absolute; bottom: 14px; width: 96px; height: 96px; border-radius: 50%; border: 3px solid #fff4; background: #fff2; color: #fff; font-size: 15px; font-weight: 800; touch-action: manipulation }
      #run { left: 16px } #jump { right: 16px } #shove { right: 124px; border-color: #ff8a8a77 }
      #shove.alert { background: #e2555599; border-color: #ff6a6a; animation: shake .25s infinite alternate }
      @keyframes shake { from { transform: rotate(-6deg) scale(1.08) } to { transform: rotate(6deg) scale(1.12) } }
      .side:active, #run.on { background: #ff9d3f99; border-color: #ff9d3f }
      #st { width: 140px; height: 6px; background: #444; border-radius: 3px; overflow: hidden } #st i { display: block; height: 100%; width: 100%; background: #f0c040 }
      #state { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 32px; font-weight: 800; display: none; text-shadow: 0 2px 6px #000; white-space: pre-line; padding: 0 20px }
    </style>
  </head>
  <body>
    <div id="join">
      <h1>Entrar no jogo</h1>
      <input id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off" />
      <input id="name" maxlength="12" placeholder="seu nome" />
      <button id="go">Entrar</button>
      <div id="err"></div>
    </div>
    <div id="pad">
      <div class="zone" id="zl"><div class="base"><div class="knob"></div></div><div class="hint">mover</div></div>
      <div class="zone" id="zr"><div class="base"><div class="knob"></div></div><div class="hint">mirar e atacar</div></div>
      <div id="top"><div><div id="hp"><i></i></div><div id="st" style="margin-top:4px"><i></i></div></div><span id="cls"></span><span id="weapon"></span><span id="time"></span></div>
      <div id="btns"><button id="b1" class="hide"></button><button id="b2" class="hide"></button><button id="b3" class="hide"></button></div>
      <button class="side" id="run">Correr</button><button class="side" id="jump">Pular</button><button class="side" id="shove">Empurrar</button><button id="use">🚗 Entrar</button>
      <div id="state"></div>
    </div>
    <script type="module" src="/src/controller/controller.js"></script>
  </body>
</html>
